# X server configuration for headless hdw4s sessions.
#
# This is deliberately NOT /etc/X11/xorg.conf. That file belongs to the
# machine's own display, if it has one, and a host with a real GPU may need
# settings that would be wrong here. Each hdw4s session passes this file with
# -config instead, so the two never interfere.
#
# The "dummy" driver declares HW_SKIP_CONSOLE, so the server never opens a
# virtual terminal and needs no access to /dev/tty0, /dev/dri or /dev/input.
# That is what lets an ordinary user start it from a systemd unit with no seat.

Section "ServerFlags"
    # No console was opened, so there is no VT to switch away from and nothing
    # for Ctrl-Alt-Backspace to zap.
    Option "DontVTSwitch"       "true"
    Option "DontZap"            "true"

    # Nothing is plugged into this server. Probing for hardware only produces
    # errors: PciForceNone suppresses the "failed to take device /dev/dri/card0"
    # complaint on hosts that do have a GPU we are not allowed to touch.
    Option "AutoAddDevices"     "false"
    Option "AutoEnableDevices"  "false"
    Option "AutoAddGPU"         "false"
    Option "PciForceNone"       "true"

    # A blanked screen would stop the stream from updating without ever
    # reaching a user who could wake it up.
    Option "BlankTime"          "0"
    Option "StandbyTime"        "0"
    Option "SuspendTime"        "0"
    Option "OffTime"            "0"
EndSection

Section "InputDevice"
    # Real input arrives over the network and is injected with XTEST, so the
    # core devices only have to exist. The "void" driver is the cheapest way to
    # satisfy that and to silence the PreInit errors from the "mouse" and "kbd"
    # drivers. Provided by xserver-xorg-input-void.
    Identifier  "hdw4s_input"
    Driver      "void"
    Option      "CoreKeyboard" "true"
    Option      "CorePointer"  "true"
EndSection

Section "Device"
    Identifier  "hdw4s_device"
    Driver      "dummy"
    # VideoRam is in kB and the driver's built-in default is 4096, i.e. 4 MB,
    # which is about enough for 1024x1024 at 24bpp and nothing else. The pool
    # backs the root window, every client pixmap and the offscreen buffers, so
    # it also sets the ceiling for how far a client may resize the desktop.
    # 256 MB comfortably covers 4K with room for a full GNOME session.
    VideoRam    262144
    DacSpeed    600
EndSection

Section "Monitor"
    Identifier  "hdw4s_monitor"
    # Deliberately permissive: the desktop is resized at runtime by the client,
    # not constrained by anything physical.
    HorizSync    5.0 - 1000.0
    VertRefresh  5.0 - 200.0
    Option       "DPMS" "false"

    # Reduced-blanking modes from "cvt -r <w> <h> 60". The dummy driver ships a
    # long built-in mode list; these only guarantee that the common sizes are
    # present before the client asks for anything else.
    Modeline "1280x720R"   63.75  1280 1328 1360 1440   720  723  728  741 +hsync -vsync
    Modeline "1368x768R"   72.25  1368 1416 1448 1528   768  771  781  790 +hsync -vsync
    Modeline "1600x900R"   97.50  1600 1648 1680 1760   900  903  908  926 +hsync -vsync
    Modeline "1920x1080R" 138.50  1920 1968 2000 2080  1080 1083 1088 1111 +hsync -vsync
    Modeline "2560x1440R" 241.50  2560 2608 2640 2720  1440 1443 1448 1481 +hsync -vsync
    Modeline "3840x2160R" 533.00  3840 3888 3920 4000  2160 2163 2168 2222 +hsync -vsync
EndSection

Section "Screen"
    Identifier   "hdw4s_screen"
    Device       "hdw4s_device"
    Monitor      "hdw4s_monitor"
    DefaultDepth 24
    SubSection "Display"
        Viewport 0 0
        Depth    24
        Modes    "1920x1080R" "1600x900R" "1280x720R"
        # Virtual is the size allocated at startup, not a hard limit: since
        # xf86-video-dummy 0.4.0 the driver reallocates on RRScreenSetSize, so a
        # client may resize past this. VideoRam above is the real ceiling.
        Virtual  3840 2160
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "hdw4s_layout"
    Screen      "hdw4s_screen"
    InputDevice "hdw4s_input"
EndSection
