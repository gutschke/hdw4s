# X server configuration for headless hdw4s sessions.
#
# This is deliberately NOT /etc/X11/xorg.conf. That file belongs to the
# machine's own display, if it has one, and a host with a real GPU may need
# settings that would be wrong here. Each session passes this file with -config
# instead, so the two never interfere.
#
# The "dummy" driver declares HW_SKIP_CONSOLE, so the server never opens a
# virtual terminal and needs no access to /dev/tty0, /dev/dri or /dev/input.
# That is what lets an ordinary user start it from a systemd unit with no seat.
#
# Everything below is load-bearing and was measured. Settings that looked
# useful but turned out to be ignored by this driver -- DacSpeed, and a list of
# Modelines -- are gone rather than left in to be mistaken for constraints.

Section "ServerFlags"
    # No console was opened, so there is no VT to switch away from and nothing
    # for Ctrl-Alt-Backspace to zap.
    Option "DontVTSwitch"       "true"
    Option "DontZap"            "true"

    # Nothing is plugged into this server, so do not go looking. On a host
    # that does have a GPU, the server still logs one error about not being
    # allowed to take /dev/dri/card0; it is harmless, the session runs
    # normally, and none of these options suppress it -- measured, despite
    # PciForceNone being widely claimed to.
    Option "AutoAddDevices"     "false"
    Option "AutoEnableDevices"  "false"
    Option "AutoAddGPU"         "false"
    Option "PciForceNone"       "true"

    # A blanked screen would stop the stream updating with no way to wake it.
    Option "BlankTime"          "0"
    Option "StandbyTime"        "0"
    Option "SuspendTime"        "0"
    Option "OffTime"            "0"
EndSection

Section "InputDevice"
    # Real input arrives over the network and is injected with XTEST, so the
    # core devices only have to exist. The "void" driver is the cheapest way to
    # satisfy that and to silence the PreInit errors from the "mouse" and "kbd"
    # drivers. Provided by xserver-xorg-input-void.
    Identifier  "hdw4s_input"
    Driver      "void"
    Option      "CoreKeyboard" "true"
    Option      "CorePointer"  "true"
EndSection

Section "Device"
    Identifier  "hdw4s_device"
    Driver      "dummy"

    # In kB, and it is a ceiling rather than an allocation: measured, a server
    # starts with about 58 MB resident whatever this says, and grows only when
    # a client actually asks for a larger screen. So it costs nothing to set it
    # high, and setting it low silently caps how far a browser may resize.
    #
    # Measured ceilings: 64 MB stops at 7680x2160, 256 MB reaches 7680x4320,
    # 768 MB reaches 15360x8640, which is past any display that exists. A
    # session that really does grow to 8K uses about 175 MB, and keeps it: the
    # framebuffer does not shrink again when the window does. The per-session
    # slice is what bounds a runaway, not this number.
    VideoRam    786432
EndSection

Section "Monitor"
    Identifier  "hdw4s_monitor"

    # These ranges must stay wide. The client generates its own modeline for
    # whatever size the browser window is and adds it at run time; a range
    # narrow enough to look realistic would reject exactly the unusual sizes
    # this needs to accept -- a HiDPI laptop in fullscreen, or an ultrawide.
    HorizSync    5.0 - 1000.0
    VertRefresh  5.0 - 200.0
    Option       "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "hdw4s_screen"
    Device       "hdw4s_device"
    Monitor      "hdw4s_monitor"
    DefaultDepth 24
    SubSection "Display"
        Viewport 0 0
        Depth    24

        # The mode the session starts at, chosen from the driver's built-in
        # list so no Modeline is needed. This is not cosmetic: the screen
        # cannot be resized smaller than the mode the output is currently
        # using, so starting at a large mode would refuse every client asking
        # for something smaller until it changed the mode too. 1920x1080 is
        # below anything a real browser window will ask for.
        Modes    "1920x1080"

        # The size allocated at startup. Not a limit: since xf86-video-dummy
        # 0.4.0 the driver reallocates when a client resizes the screen, and
        # VideoRam above is the real ceiling.
        Virtual  1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "hdw4s_layout"
    Screen      "hdw4s_screen"
    InputDevice "hdw4s_input"
EndSection
