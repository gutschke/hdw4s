# The one group that may open a desktop's streaming server. Its only member is
# the relay in front of each session (hdw4s-proxy@.service, SupplementaryGroups=).
#
# A SYSTEM group, created by systemd-sysusers, because what it grants is reach
# into every desktop on the machine: /run/hdw4s/stream/<instance>/s is owned by
# that session's own account and handed to this group, and nothing else may
# enter it. A person whose account is put in this group can open every other
# desktop's stream directly, without the front door, so a named session whose
# account is found in it refuses to start (hdw4s-session says so).
g hdw4s-relay -
