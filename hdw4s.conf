# Defaults for every hdw4s session. Settings for one session go in
# /etc/hdw4s/<instance>.conf, which is read after this file and wins.
#
# Run "hdw4s show <instance>" to see the values a session will actually use
# and which file each of them came from.

# --- network ---------------------------------------------------------------

# Sessions are allocated a port from a fixed, contiguous block. The block is
# opened in the firewall and reserved with the kernel once, so a rule can never
# fall behind which sessions happen to be running. Changing either value means
# running "hdw4s firewall --apply" again.
#HDW4S_BASE_PORT=7300
#HDW4S_BLOCK_SIZE=64

# Addresses allowed to reach a session, separated by spaces. Both IPv4 and IPv6
# addresses and prefixes are accepted.
#
# Leaving this empty means only this machine can connect. That is right when
# the reverse proxy runs here too and reaches a session over a filesystem
# socket -- see TRANSPORTS in the manual, which is the better arrangement where
# it is available. Where the proxy is on another machine, its address has to be
# listed here or it cannot reach anything.
#
# Against other machines this is the main thing protecting a session, and where
# HDW4S_AUTH is none it is the only thing: anything that can reach a session
# port then gets that user's desktop with no further questions. There is no
# login screen either way -- the session exists to be fronted by a proxy that
# has already identified the user.
#
# It protects nothing against the other accounts on this machine. It filters
# what arrives from elsewhere, while the streaming server listens on loopback
# and any local account can open a loopback port. That is what HDW4S_AUTH is
# for, and why "hdw4s enable" turns it on for the sessions it creates.
HDW4S_PROXIES=''

# The address the streaming server binds. Leave this alone unless you know
# why you are changing it. The default is loopback, with the socket unit in
# front as the only way in, and the firewall above deciding who may reach that.
# Binding anything wider publishes the streaming server directly on the network
# at a port the firewall does NOT cover, with no authentication in front of it.
#HDW4S_ADDR=127.0.0.1

# The streaming server opens connection-candidate sockets across the ephemeral
# port range, on every address the machine has, and offers no way to confine
# them. They are not a way in by themselves -- using one needs credentials
# exchanged over the signalling channel -- but they are unauthenticated
# listeners on whatever addresses exist, public ones included.
#
# By default the firewall drops new inbound connections to that range, which
# closes them without affecting anything else: those ports belong to outgoing
# connections, whose replies are accepted as established traffic anyway. Set
# this to "direct" only where the browser really does reach the streaming
# server directly rather than through a proxy.
#HDW4S_MEDIA_PORTS=proxied

# There is deliberately no setting here for STUN or TURN.
#
# The streaming server's STUN server cannot be changed: its own configuration
# appends the default one unless you name exactly that server, so a setting
# could only ever add a second, never replace the first. A knob that cannot do
# what its name says is worse than no knob.
#
# TURN is disabled outright, and that is not configurable either. The server
# ships with a third party's relay and a shared secret published in its own
# source; leaving that on would route video, keystrokes and clipboard through
# a machine you have never heard of. Turning it on for a relay you run needs
# somewhere to keep that relay's secret, and this file is not it -- a session
# reads it as the desktop user, so every account on the machine could read the
# secret. That needs the same sealing "hdw4s auth" uses, and until it exists
# the honest answer is that this package does not support a relay.
#
# None of this reaches the wire any more. A session serves one WebSocket and
# nothing else: with dual mode locked off it opens no UDP socket at all, so
# there are no connection candidates to gather and no STUN server to ask. The
# firewall still closes that range, which is now belt and braces rather than
# the thing standing between a desktop and the network.

# --- sharing a home directory ----------------------------------------------

# The desktop's file indexer. Off by default, and only where
# HDW4S_ISOLATION=profile -- without that the indexer belongs to the account
# rather than to this session, so turning it off here would reach the user's
# real login on this machine, and the session leaves it alone and says so.
#
# Why off: on a home shared between machines the indexer is work without an
# answer. Each machine crawls the same tree over the network, keeps its own
# copy of the result on local disk, and cannot see a change made from another
# machine, because the only change notification it has is inotify and inotify
# does not cross NFS.
#
# What it costs: searching *inside* documents stops working. Searching by name
# keeps working in the file manager and in the overview, but it walks the tree
# rather than consulting an index, which on a large home over a network is
# slower. A user who wants it back for their own session can turn it on in
# Settings -> Search -> Search Locations, which is where these settings live.
#HDW4S_INDEXING=off

# Image thumbnails in the file manager. Off by default, and like the indexer
# only where HDW4S_ISOLATION=profile.
#
# The file manager's own setting for this is "local-only", which sounds like
# the protection a network home wants and is not: "local" there means the
# kernel calls the filesystem native, and it calls NFS native. So out of the
# box a network home is thumbnailed exactly as eagerly as a local disk, and
# every image is read in full over the network to do it.
#
# These are weaker grounds than the indexer and the difference is worth
# knowing. The result is cached in the profile, which persists, so it is a cost
# per machine rather than per session; the file manager skips anything over its
# own size limit anyway; and unlike the indexer this is something the user can
# see and probably wants. What tips it is the delivery: a desktop that reaches
# a browser as a video stream pays for a wall of thumbnails twice, once over
# the network and again in the encoder.
#
# Set it to on if the people using this would rather have their photographs.
#HDW4S_THUMBNAILS=off

# How a high-density (HiDPI, "Retina") client is handled.
#
#   scale   ask the client for the size of its window and let the browser
#           stretch the result. Correct size on a 2x screen, byte-identical on
#           a 1x one, and a quarter of the pixels through the encoder. The
#           picture is smoothed rather than pixel-exact. This is the default.
#   native  ask for the client's full device resolution. Pixel-exact, and on
#           GNOME everything comes out at half size, because the desktop is
#           still drawn at scale 1.
#
# "native" is upstream's default and is wrong here. GNOME would scale the
# desktop itself, but it works that out from the monitor's physical size, and a
# virtual monitor reports none -- so GNOME stops at scale 1 and there is no
# automation to enable. The DPI the streaming server can be told does not help
# either: on GNOME it reaches nothing that draws.
#
# A user who wants the sharper picture can switch it back for their own browser
# from the sidebar, without a restart.
#HDW4S_HIDPI=scale

# Whether these desktops may be heard.
#
# The streaming server refuses microphone data on exactly one condition: the
# feature disabled *and* locked. That is what this ships as, so a desktop
# cannot be listened to through a flaw in the page or by a client that asks
# nicely. Setting this to "yes" lifts the refusal and leaves the lock on, so
# the operator still decides and a connected page still cannot change it.
#
# It does not turn anyone's microphone on, and does not start the uplink for
# them either. Asking the browser for a device as the session connects stops
# the video stream from ever starting when the request cannot be satisfied --
# a declined prompt, or a machine with no microphone -- and the desktop stays
# blank with nothing said. So this grants the capability and the person at the
# desk turns the uplink on from the session's own menu when they want it.
#
# Read when a session starts, so it takes effect on the next restart.
#HDW4S_MICROPHONE=no

# Whether these desktops may see a camera.
#
# The same switch as HDW4S_MICROPHONE, and the same refusal behind it: the
# streaming server turns webcam frames away only when the feature is disabled
# *and* locked, which is what this ships as. "yes" lifts the refusal, keeps the
# lock, and additionally puts the V4L2 interposer into the session's
# applications -- the shared object that answers a program's camera calls from
# the session's own socket, since a container has no camera and no kernel
# device for one. Without it a program would find nothing to open.
#
# It does not point a camera at anyone, and does not start the uplink: see the
# note under HDW4S_MICROPHONE for why asking the browser for a device at
# connect time is a way to end up with a blank desktop.
#
# Read when a session starts, so it takes effect on the next restart.
#HDW4S_WEBCAM=no

# Offer WebRTC as well as the WebSocket transport, so a client can switch to it
# from the side menu. It is off by default because WebRTC carries its media
# outside the HTTP connection: the browser has to reach this machine directly,
# which the reverse proxy in front plays no part in and not every network allows.
# Where it does work it is worth having.
#
# Turning it on brings the streaming server's TURN defaults into play, and they
# name a live third-party relay with a published shared secret. With no TURN
# server configured below, a session is therefore given a host name that cannot
# resolve, so no relay is offered and nothing is asked of a stranger's server.
# Never set HDW4S_TURN_HOST to the empty string to disable it: an empty value is
# read as no value at all, and restores the relay.
#
# Read when a session starts, so it takes effect on the next restart.
#HDW4S_WEBRTC=no

# A TURN server of your own, used only when HDW4S_WEBRTC=yes. Set the host and
# HDW4S_TURN_SECRET together: the secret signs the short-lived credential the
# browser is given, and a session refuses to start with a host but no secret,
# rather than signing with something guessable. Left unset, no usable relay is
# offered and a client that cannot reach the desktop directly simply fails to
# connect, which is the honest outcome.
#HDW4S_TURN_HOST=
#HDW4S_TURN_PORT=3478
#HDW4S_TURN_SECRET=

# A GNOME session assumes it is the only one using its home directory. When the
# same home is mounted on more than one machine and a desktop runs against it on
# each, those sessions end up writing the same settings database, the same
# keyring and the same metadata store, none of which are safe to share over a
# network filesystem. That is the case this exists for; one account with a
# desktop on several machines is supported, and this is what makes it work.
#
#   none      the session uses the home directory as it finds it. Correct when
#             the account is used for nothing else. This is the default so that
#             existing installations keep working.
#
#   profile   the session keeps the shared home for the user's files, but takes
#             its settings, state and cache from a private directory on local
#             disk. Documents, Desktop and Downloads still point at the real
#             shared directories. Desktop appearance, saved passwords, browser
#             profile and recently-used files become per-session.
#
#HDW4S_ISOLATION=none

# Where an isolated session keeps that private directory. Local disk by design:
# the settings database and the metadata stores behind it use memory-mapped and
# journalled files that are documented not to work over NFS.
#HDW4S_PROFILE_DIR=/var/lib/hdw4s

# --- session lifetime ------------------------------------------------------

# A desktop starts when somebody first connects to it, not at boot, and it
# stays up after they disconnect so that returning to it finds everything where
# it was left.
#
# This is how long a desktop may go with nothing connected to it before it is
# stopped. Its files and settings are untouched, and the next connection starts
# it again -- what is reclaimed is the memory of a desktop somebody opened once
# and never came back to. Set to 0 to never stop one.
#
# Measured by connections rather than by typing: a desktop with a window open
# and nobody at the keyboard may be running something deliberately left to run.
#HDW4S_IDLE_DAYS=7

# --- streaming -------------------------------------------------------------

# The desktop to start. Anything that runs on X11 works; the streaming, audio
# and isolation do not care which.
#
# Worth knowing: GNOME 50, which Ubuntu 26.04 ships, removes the X11 session
# that the current Selkies release needs. Xorg and the lighter desktops have no
# such plan, so changing this line is the whole migration when that matters.
#HDW4S_SESSION=gnome-session
#HDW4S_SESSION=startxfce4

# Let the desktop follow the browser window. The streaming server defaults this
# on and does the resizing itself, so setting it here is a statement of intent
# rather than a workaround. Turn it off and the desktop stays at its startup
# size and the browser letterboxes it, which is the single most noticeable way
# this product feels wrong.
#HDW4S_RESIZE=true

# The locale the desktop runs in. Taken from /etc/default/locale, falling back
# to C.UTF-8. It must be a UTF-8 locale: parts of the desktop, the terminal
# among them, refuse to start without one.
#HDW4S_LANG=en_US.UTF-8

# Where a session starts, and how far a client may move it from the video
# settings panel. "30,8-60" starts at 30 and lets someone who wants smoother
# motion ask for up to 60; a bare number is a hard ceiling, so "30" means 30 and
# nothing else.
#
# Measured on one session at 1280x656, over 25 seconds, both reaching the rate
# they were given:
#
#   with a GPU (VAAPI)      30fps  16% of a core     60fps  19%
#   without one (x264)      30fps  34% of a core     60fps  49%
#
# So the upper half of the default range is nearly free where the machine has a
# GPU, and costs about half a core per session that asks for it where it does
# not. 120 was measured at 27% on hardware and works if you set it.
#HDW4S_FRAMERATE=30,8-60
#HDW4S_ENCODER=h264enc

# Whether the desktop's display density follows the browser. Following it is
# what makes text the right size on a HiDPI screen or in a zoomed window, and
# it is the default for that reason.
#
# The cost falls on a shared home directory. Applying a density means writing
# ~/.Xresources and ~/.xsettingsd, which are not under ~/.config and so are not
# moved by HDW4S_ISOLATION=profile: they are the account's own files, seen from
# every machine it logs in to. The first keeps the user's other lines and
# replaces their Xft.dpi; the second is rewritten whole. Pin a number here and
# the server refuses the density clients ask for, so it stops rewriting them;
# pin 96 and it writes nothing at all, because 96 is where the desktop starts.
#HDW4S_DPI=follow

# --- ephemeral sessions ------------------------------------------------------

# How many ephemeral slots the machine mints at boot. Each one is an account
# that can hold a session which keeps nothing: its home and its settings are
# destroyed when the connection ends, and the next connection starts fresh.
#
# The slots are minted whether or not anyone uses them -- they cost an entry in
# /run and nothing else until a session starts.
#HDW4S_EPHEMERAL_SLOTS=1

# What one ephemeral session may occupy. All three are filesystems that live in
# memory, so these are the numbers that decide how much of the machine a single
# session can take, and how many slots it is safe to run.
#
# They are set here rather than in the unit because the right values depend on
# the machine and on what the sessions are for -- a container with 16 GB serving
# three other desktops and a mail server is a different answer from a host that
# does nothing else. Sizes are given the way mount(8) takes them: bytes, a K, M
# or G suffix, or a percentage of physical memory.
#
# The defaults total 3.5 GB per slot.
#
#   the home, /home/user. Documents, downloads, whatever the session makes.
#HDW4S_EPHEMERAL_HOME_SIZE=1G
#
#   the profile. Settings, the dconf database, GNOME state, the keyring, and
#   the browser profile with its cache -- which is the part that actually grows,
#   and the reason this is the largest of the three.
#HDW4S_EPHEMERAL_PROFILE_SIZE=2G
#
#   shared memory, /dev/shm. A session gets its own rather than the machine's.
#   Chrome is the consumer that matters and the one that fails obscurely when
#   this is too small; the 64 MB that containers default to is the documented
#   trouble threshold, well below this.
#HDW4S_EPHEMERAL_SHM_SIZE=512M

# The desktop background an ephemeral session starts with, and the reason it is
# a setting: it is the one thing on screen that tells whoever is sitting there
# that this desktop keeps nothing.
#
# The default is Canonical aubergine from the published brand palette. On brand
# without being the desktop's own colour -- Yaru paints Ubuntu orange (#e95420)
# and carries none of the aubergines -- so it belongs to the family while still
# not looking like an ordinary desktop, which is the whole job of a cue. Other
# palette colours, if you want one: #77216f light aubergine, #5e2750 mid
# aubergine, #2c001e dark aubergine.
#
# The session cannot change it back: the background keys are locked, all six of
# them, since Settings rewrites the lot when a stock wallpaper is picked.
#HDW4S_EPHEMERAL_BACKGROUND=#772953

# --- upstream --------------------------------------------------------------

# A local change to put back on top of every Selkies release that is installed.
#
# For carrying a patch that is not upstream yet. Without this the updater does
# exactly what it should -- installs the release as published -- and the local
# change is gone until somebody notices, which on a camera or a microphone means
# noticing that a light came on. Switching the updater off instead trades that
# for missing every fix upstream makes.
#
# Name an executable. It is run after a release is installed and before the check
# that the installation works, with the install prefix as its only argument, so a
# patch that breaks the release is rolled back with the release. It must be safe
# to run twice: it runs on every check, not only after an install, because a
# release that was reinstalled carries no patch and reports nothing wrong.
#
# So write it to leave a tree it has already patched alone -- compare before
# copying. Rewriting the same bytes every night costs nothing on a plain disk
# and a night's worth of new blocks on a snapshotted one.
#
# Remove this once the change is upstream. A patch nobody remembers is a
# difference between this machine and every other one, with nothing to explain it.
#SELKIES_PATCH=/etc/hdw4s/selkies-patch

# Pin a specific Selkies release and stop following upstream. Left unset, the
# updater tracks upstream but refuses to install a release it was not built
# against, and says so in the journal rather than breaking the machine.
#
# Give it the version upstream itself prints -- "selkies --version" -- with or
# without the "v" of the git tag. Not the package version: "2.0.0~rc0-1~ubuntu24.04"
# is the same release spelled for dpkg, and the updater works that out for
# itself. A release pinned here is verified against the digest GitHub publishes
# for its asset, and refused if there is none.
#SELKIES_VERSION=2.0.0rc0
