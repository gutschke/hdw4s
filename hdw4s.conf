# Defaults for every hdw4s session. Settings for one session go in
# /etc/hdw4s/<instance>.conf, which is read after this file and wins.
#
# Run "hdw4s show <instance>" to see the values a session will actually use
# and which file each of them came from.

# --- network ---------------------------------------------------------------

# Sessions are allocated a port from a fixed, contiguous block. The block is
# opened in the firewall and reserved with the kernel once, so a rule can never
# fall behind which sessions happen to be running. Changing either value means
# running "hdw4s firewall --apply" again.
#HDW4S_BASE_PORT=7300
#HDW4S_BLOCK_SIZE=64

# Addresses allowed to reach a session, separated by spaces. Both IPv4 and IPv6
# addresses and prefixes are accepted.
#
# Leaving this empty means only this machine can connect, which is safe but
# useless: the reverse proxy that terminates TLS and authenticates users runs
# somewhere else, and it needs to be listed here to reach anything.
#
# THIS IS THE ONLY THING PROTECTING A SESSION. The streaming server is run with
# authentication switched off on purpose, because it exists to be fronted by a
# proxy that has already identified the user. Anything that can reach a session
# port gets that user's desktop with no further questions.
HDW4S_PROXIES=''

# The address the streaming server binds. It has to be reachable from the
# proxy, which is normally on another machine, so this is not loopback and the
# firewall above is what limits who may connect.
#HDW4S_ADDR=0.0.0.0

# The streaming server opens connection-candidate sockets across the ephemeral
# port range, on every address the machine has, and offers no way to confine
# them. They are not a way in by themselves -- using one needs credentials
# exchanged over the signalling channel -- but they are unauthenticated
# listeners on whatever addresses exist, public ones included.
#
# By default the firewall drops new inbound connections to that range, which
# closes them without affecting anything else: those ports belong to outgoing
# connections, whose replies are accepted as established traffic anyway. Set
# this to "direct" only where the browser really does reach the streaming
# server directly rather than through a proxy.
#HDW4S_MEDIA_PORTS=proxied

# --- sharing a home directory ----------------------------------------------

# A GNOME session assumes it is the only one using its home directory. When the
# same home is mounted on more than one machine, or another desktop is already
# logged in against it, two sessions end up writing the same settings database,
# the same keyring and the same metadata store, none of which are safe to share
# over a network filesystem.
#
#   none      the session uses the home directory as it finds it. Correct when
#             the account is used for nothing else. This is the default so that
#             existing installations keep working.
#
#   profile   the session keeps the shared home for the user's files, but takes
#             its settings, state and cache from a private directory on local
#             disk. Documents, Desktop and Downloads still point at the real
#             shared directories. Desktop appearance, saved passwords, browser
#             profile and recently-used files become per-session.
#
#HDW4S_ISOLATION=none

# Where an isolated session keeps that private directory. Local disk by design:
# the settings database and the metadata stores behind it use memory-mapped and
# journalled files that are documented not to work over NFS.
#HDW4S_PROFILE_DIR=/var/lib/hdw4s

# --- session lifetime ------------------------------------------------------

# A desktop starts when somebody first connects to it, not at boot, and it
# stays up after they disconnect so that returning to it finds everything where
# it was left.
#
# This is how long a desktop may go with nothing connected to it before it is
# stopped. Its files and settings are untouched, and the next connection starts
# it again -- what is reclaimed is the memory of a desktop somebody opened once
# and never came back to. Set to 0 to never stop one.
#
# Measured by connections rather than by typing: a desktop with a window open
# and nobody at the keyboard may be running something deliberately left to run.
#HDW4S_IDLE_DAYS=7

# --- streaming -------------------------------------------------------------

# The desktop to start. Anything that runs on X11 works; the streaming, audio
# and isolation do not care which.
#
# Worth knowing: GNOME 50, which Ubuntu 26.04 ships, removes the X11 session
# that the current Selkies release needs. Xorg and the lighter desktops have no
# such plan, so changing this line is the whole migration when that matters.
#HDW4S_SESSION=gnome-session
#HDW4S_SESSION=startxfce4

# Let the desktop follow the browser window. The streaming server defaults this
# off, and with it off it does not attach its resize handler at all, so the
# desktop stays at its startup size and the browser letterboxes it.
#HDW4S_RESIZE=true

# The locale the desktop runs in. Taken from /etc/default/locale, falling back
# to C.UTF-8. It must be a UTF-8 locale: parts of the desktop, the terminal
# among them, refuse to start without one.
#HDW4S_LANG=en_US.UTF-8

#HDW4S_FRAMERATE=30
#HDW4S_ENCODER=x264enc

# --- upstream --------------------------------------------------------------

# Pin a specific Selkies release and stop following upstream. Left unset, the
# updater tracks upstream but refuses to install a release whose layout it does
# not understand, and says so in the journal rather than breaking the machine.
#SELKIES_VERSION=1.6.2
