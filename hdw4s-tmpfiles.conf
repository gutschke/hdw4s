# The directory every desktop binds as /shared (BindPaths=/run/hdw4s-shared:/shared,
# written by hdw4s-ephemeral-slots when HDW4S_SHARED is on). Made at every boot
# whether or not the feature is on, so that the bind's source always exists:
# empty and root's until hdw4s-shared-expose binds a store's table onto it.
#
# NO MODE, NO OWNER, AND THAT IS THE POINT. Created, it is root's and 0755 (the
# defaults). Given a mode here, every later "systemd-tmpfiles --create" -- a
# package upgrade runs one -- would chmod whatever is at this path, and while
# the table is bound onto it that is the TABLE: 0777 put back to 0755, and
# nobody can write to /shared until the next boot. Measured: a "0755" line
# turns an existing 0777 directory into 0755; "-" leaves it alone. No age
# either, so a clean never empties the table under its sweep.
d /run/hdw4s-shared - - - -
