# THE ONE DIRECTORY every runtime file of this package lives under: each desktop's
# own runtime directory at session/<instance>, and beside "session" everything
# else -- the front-door sockets, the stream root, the requests, the locks, and
# the two lines below. Root's and 0755, as /run itself is: a desktop may list it
# and write nothing in it. Stated here, once, and by nothing else: no program of
# this package gives it a mode, and it is never a mount of its own -- a mount
# here would sit under the /shared bind below and every desktop's view of it.
# No age: a clean must never empty it.
d /run/hdw4s 0755 root root -

# The directory every desktop binds as /shared (BindPaths=/run/hdw4s/shared:/shared,
# written by hdw4s-ephemeral-slots when HDW4S_SHARED is on). Made at every boot
# whether or not the feature is on, so that the bind's source always exists:
# empty and root's until hdw4s-shared-expose binds a store's table onto it.
#
# NO MODE, NO OWNER, AND THAT IS THE POINT. Created, it is root's and 0755 (the
# defaults). Given a mode here, every later "systemd-tmpfiles --create" -- a
# package upgrade runs one -- would chmod whatever is at this path, and while
# the table is bound onto it that is the TABLE: 0777 put back to 0755, and
# nobody can write to /shared until the next boot. Measured: a "0755" line
# turns an existing 0777 directory into 0755; "-" leaves it alone. No age
# either, so a clean never empties the table under its sweep.
d /run/hdw4s/shared - - - -

# A named desktop's failed starts, one root-owned file per desktop, written by
# hdw4s-ledger from the unit's ExecStopPost= and read by the desktop's own start
# and by the refusal page. Root's and 0711: anybody may open a record by its name
# -- the desktop's own check and the refusal page do exactly that -- nobody may
# list which desktops have one, and no desktop can write one. A mode is right
# here, unlike the line above: nothing is ever bound onto this directory. No age:
# the writer prunes its own entries, and a clean must not lift a latch early.
d /run/hdw4s/ledger 0711 root root -
