name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest. "latest" moves to a new release without
    # warning, and this project cares which GNOME and which systemd it is built
    # against; a runner upgrade should be a deliberate change to this line, not
    # a build that breaks one morning for no reason anybody asked for.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build and check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debhelper dpkg-dev fakeroot groff-base lintian shellcheck

      # Exactly what .github/checks.sh runs locally, so a green run here means
      # the same commands passed on a developer's machine first.
      - name: Checks
        run: .github/checks.sh --package

      - name: Collect the package
        run: |
          mkdir -p dist
          mv ../hdw4s_*_all.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: hdw4s-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev

      # A release whose artifact is not the version the tag claims is worse
      # than no release, because nobody notices until they install it.
      - name: Check the tag matches debian/changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          changelog="$(dpkg-parsechangelog -S Version)"
          if [ "${tag}" != "${changelog}" ]; then
            echo "Tag ${GITHUB_REF_NAME} says ${tag}," \
                 "debian/changelog says ${changelog}." >&2
            exit 1
          fi
          echo "Both agree on ${changelog}."

      - uses: actions/download-artifact@v4
        with:
          name: hdw4s-deb
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install with: sudo apt install ./hdw4s_${GITHUB_REF_NAME#v}_all.deb"
