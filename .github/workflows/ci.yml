name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should stop burning a runner rather than race the one that
# replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest. "latest" moves to a new release on
    # GitHub's schedule, taking the shellcheck, lintian, systemd and nft
    # versions with it; a runner upgrade should be a deliberate edit here, not
    # a build that breaks one morning for no reason anybody asked for.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # fetch-depth: 0, because checks.sh reads COMMIT MESSAGES as well as files
      # -- a push publishes history, and the containment rule was enforced on
      # files and unenforced on messages until 2.4.0. The default shallow clone
      # has no master to compare against, so the check would SKIP here forever,
      # which is the loudest possible version of the failure it exists for.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and check dependencies
        run: |
          # build-essential is an implicit build dependency of every Debian
          # package; dpkg-checkbuilddeps refuses without it, and a developer
          # machine always has it, so its absence only ever shows up here.
          # xdg-user-dirs because tests.sh runs the real xdg-user-dirs-update
          # against the guard that keeps it from recreating a home's folders,
          # and fails rather than skips without it.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends \
              build-essential debhelper dpkg-dev fakeroot groff-base \
              lintian shellcheck ronn xdg-user-dirs && break
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done

      # The /shared tool's tests mount real filesystems with real flags, which an
      # unprivileged user may do only in a user namespace of its own (unshare
      # -Urm). Ubuntu 24.04 restricts those through AppArmor by default. Without
      # this the tests FAIL, deliberately, rather than skip: a guard nobody has
      # seen refuse is not known to refuse.
      - name: Allow unprivileged user namespaces
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ ! -e "${f}" ] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Exactly what .github/checks.sh runs locally, so a green run here tells
      # a maintainer nothing they could not already have known before pushing.
      - name: Checks
        run: .github/checks.sh --package

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # Full history here too, for the same reason as the build job above.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends \
              build-essential debhelper dpkg-dev fakeroot groff-base \
              lintian shellcheck ronn xdg-user-dirs && break
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done

      # The package is rebuilt here from the tag rather than carried over from
      # the build job. It costs seconds and removes any question about what
      # happened to the file in between.
      - name: Build and check the tagged tree
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          # checks.sh compares the changelog against EXPECT_VERSION, so a tag
          # and a changelog that disagree stop the release here. An artifact
          # that is not the version its tag claims is worse than no artifact:
          # nobody notices until they install it.
          EXPECT_VERSION="${EXPECT_VERSION#v}" .github/checks.sh --package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # BOTH packages: from 2.4.11 hdw4s depends on hdw4s-shared-sweep at
          # the same version, which no archive carries, so a release with hdw4s
          # alone could not be installed by following its own notes.
          debs="../hdw4s_${version}_all.deb ../hdw4s-shared-sweep_${version}_all.deb"
          for d in ${debs}; do [ -s "${d}" ] || { echo "missing ${d}" >&2; exit 1; }; done
          # shellcheck disable=SC2086  # two plain file names, split on purpose
          sha256sum ${debs} | sed 's|\.\./||' > SHA256SUMS
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" ${debs} SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install with:

              sudo apt install ./hdw4s_${version}_all.deb ./hdw4s-shared-sweep_${version}_all.deb

            Verify with the attached SHA256SUMS."
