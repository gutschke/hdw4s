name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push should stop burning a runner rather than race the one that
# replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest. "latest" moves to a new release on
    # GitHub's schedule, taking the shellcheck, lintian, systemd and nft
    # versions with it; a runner upgrade should be a deliberate edit here, not
    # a build that breaks one morning for no reason anybody asked for.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install build and check dependencies
        run: |
          # build-essential is an implicit build dependency of every Debian
          # package; dpkg-checkbuilddeps refuses without it, and a developer
          # machine always has it, so its absence only ever shows up here.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends \
              build-essential debhelper dpkg-dev fakeroot groff-base \
              lintian shellcheck ronn && break
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done

      # The client patch is checked properly only when there is a client to
      # apply it to; without one the check falls back to counting brackets,
      # which passes JavaScript that is balanced and still invalid. A runner has
      # no installed client, so fetch the pinned one. Failing to fetch is not
      # fatal -- the weaker check still runs and says which mode it used -- but
      # it should be the exception rather than the normal state of CI.
      - name: Fetch the client the patch is written against
        continue-on-error: true
        run: |
          version="$(sed -n "s/^KNOWN_GOOD='\([^']*\)'.*/\1/p" hdw4s-update)"
          url="https://github.com/selkies-project/selkies/releases/download"
          url="${url}/v${version}/selkies-gstreamer-web_v${version}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/client"
          curl -fsSL --proto '=https' --max-time 300 --retry 3 -o "${RUNNER_TEMP}/web.tgz" "${url}"
          tar -xzf "${RUNNER_TEMP}/web.tgz" -C "${RUNNER_TEMP}/client"
          # The tarball unpacks into one top-level directory whose name has
          # changed between releases, so find it rather than assume it.
          root="$(find "${RUNNER_TEMP}/client" -name app.js -printf '%h\n' | head -1)"
          [ -n "${root}" ] || { echo 'no app.js in the tarball'; exit 1; }
          echo "HDW4S_GST_WEB=${root}" >> "${GITHUB_ENV}"

      # Exactly what .github/checks.sh runs locally, so a green run here tells
      # a maintainer nothing they could not already have known before pushing.
      - name: Checks
        run: .github/checks.sh --package

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && \
            sudo apt-get install -y --no-install-recommends \
              build-essential debhelper dpkg-dev fakeroot groff-base \
              lintian shellcheck ronn && break
            echo "apt attempt ${attempt} failed; retrying"
            sleep 5
          done

      # The package is rebuilt here from the tag rather than carried over from
      # the build job. It costs seconds and removes any question about what
      # happened to the file in between.
      - name: Build and check the tagged tree
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          # checks.sh compares the changelog against EXPECT_VERSION, so a tag
          # and a changelog that disagree stop the release here. An artifact
          # that is not the version its tag claims is worse than no artifact:
          # nobody notices until they install it.
          EXPECT_VERSION="${EXPECT_VERSION#v}" .github/checks.sh --package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          deb="../hdw4s_${version}_all.deb"
          sha256sum "${deb}" | sed 's|\.\./||' > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" "${deb}" SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "Install with:

              sudo apt install ./hdw4s_${version}_all.deb

            Verify with the attached SHA256SUMS."
