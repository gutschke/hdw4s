# The relay server's own system user (hdw4s-shared-relay-server@.service,
# User=). A FIXED user, not DynamicUser=: DynamicUser= implies
# RestrictSUIDSGID=, which answers openat2 -- the server's only way to resolve
# a name beneath the table -- with ENOSYS (measured in the packaged unit,
# 2026-10-02). It owns nothing and may write nothing but atimes, through
# CAP_FOWNER, inside the store; its unit denies every mode, owner, mknod and
# link call, which is what RestrictSUIDSGID= was guarding.
u hdw4s-shared-relay - "hdw4s /shared usage relay" / /usr/sbin/nologin
